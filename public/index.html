
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pawcademy Games</title>
  <meta name="description" content="Discover games made with Construct 3.">

  <style>
    :root {
      --coral: #ff6b6b;
      --yellow: #ffd166;
      --mint: #06d6a0;
      --purple: #5b5fef;
      --ink: #25243a;
      --cream: #fffaf0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--cream);
      color: var(--ink);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 18px 6%;
      background: linear-gradient(135deg, #fff9ed, #f3edff);
      border-bottom: 1px solid #e8ddff;

    }
    
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-decoration: none;
    }
    
    .paw-logo {
      display: block;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      color: var(--purple);
      transform: rotate(-15deg);
    }
    
    .logo strong {
      color: var(--purple);
      font-weight: 900;
    }
    
    @media (max-width: 480px) {
      .logo {
        gap: 7px;
        font-size: 17px;
      }
    
      .paw-logo {
        width: 30px;
        height: 30px;
      }
    }

    nav a {
      color: var(--ink);
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      padding: 85px 7%;
      background: var(--yellow);
      text-align: center;
    }

    .tag {
      display: inline-block;
      background: white;
      padding: 9px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(40px, 7vw, 76px);
      line-height: 1.05;
      margin: 22px auto;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto 28px;
    }

    .button {
      display: inline-block;
      background: var(--purple);
      color: white;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: bold;
    }

    .games { padding: 55px 7%; }

    .games h2 { font-size: 34px; }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .game-card {
      background: white;
      border-radius: 22px;
      padding: 16px;
      border: 2px solid #f0eadf;
      overflow: hidden;
    }

    .game-art {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 16px;
      background: #ffe0e0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-size: 60px;
    }

    .game-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-card h3 { margin-bottom: 8px; }

    .game-card p {
      line-height: 1.6;
      color: #666;
    }

    .genre {
      color: #5b5fef;
      font-size: 13px;
      font-weight: bold;
    }
    
    .game-card-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 12px 0 14px;
    }
    
    .game-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.3;
      border: 1px solid transparent;
    }
    
    
    .game-badge-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 15px;
      height: 15px;
      color: inherit;
    }
    
    .game-badge-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    
    /* Genre: purple */
    .game-badge.genre {
      color: #6D42B5;
      background: #EDE5FF;
      border-color: #DCCBFF;
    }
    
    /* Platform: green */
    .game-badge.platform {
      color: #207A4B;
      background: #DFF5E8;
      border-color: #BCE8CD;
    }
    
    /* Control: orange */
    .game-badge.control {
      color: #9A5A12;
      background: #FFF0D8;
      border-color: #F5D9A8;
    }
    
    @media (max-width: 480px) {
      .game-card-badges {
        gap: 6px;
      }
    
      .game-badge {
        padding: 5px 9px;
        font-size: 11px;
      }
    }

    .game-card .button { margin-top: 8px; }

    .message {
      padding: 20px 0;
      line-height: 1.6;
    }

    footer {
      padding: 28px 7%;
      text-align: center;
      background: white;
    }

    @media (max-width: 750px) {
      .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 500px) {
      .game-grid { grid-template-columns: 1fr; }
      .hero { padding: 60px 7%; }
    }

    .game-card-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }
    
    .game-card-actions .button {
      flex: 0 0 auto;
      width: auto;
      margin: 0;
    }

    
    /* Pawcademy Game Filters */
    .game-filters {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 28px 0 32px;
      padding: 24px;
      background: linear-gradient(135deg, #fff9ed, #f5f0ff);
      border: 1px solid #eee6ff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(76, 53, 114, 0.08);
    }
    
    .filter-row {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      width: 100%;
    }
    
    .filter-row-top .filter-group {
      flex: 1 1 0;
      min-width: 0;
      max-width: none;
    }
    
    .filter-row-top .search-group {
      flex: 1.4 1 0;
    }
    
    .filter-row-bottom {
      align-items: flex-end;
      flex-wrap: wrap;
    }
    
    .filter-row-bottom .platform-filter-group,
    .filter-row-bottom .control-filter-group {
      flex: 0 1 auto;
      min-width: 0;
      max-width: none;
    }
    
    .platform-filter,
    .control-filter {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .filter-row-bottom .reset-filters {
      flex: 0 0 auto;
      width: auto;
      white-space: nowrap;
    }
    
    @media (max-width: 900px) {
      .filter-row {
        flex-wrap: wrap;
      }
    
      .filter-row-top .filter-group {
        flex: 1 1 220px;
      }
    
      .filter-row-top .search-group {
        flex: 1 1 260px;
      }
    }
    
    @media (max-width: 600px) {
      .game-filters {
        gap: 16px;
        padding: 14px;
      }
    
      .filter-row {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
    
      .filter-row .filter-group {
        flex: none;
        width: 100%;
        min-width: 0;
        gap: 5px;
      }
    
      .filter-row-bottom .platform-filter-group,
      .filter-row-bottom .control-filter-group {
        align-items: flex-start;
      }
    
      .platform-filter,
      .control-filter {
        justify-content: flex-start;
        flex-wrap: wrap;
        gap: 6px;
      }
    
      .filter-row-bottom .reset-filters {
        width: 100%;
      }
    }

    
    /* Filter layout on tablets and mobile */
    @media (max-width: 900px) {
      .game-filters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 16px;
      }
    }
    
    /* Filter layout on small screens */

    @media (max-width: 600px) {
      .game-filters {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 10px;
        margin: 20px 0 24px;
        padding: 14px;
      }
    
      .game-filters .filter-group {
        flex: none;
        width: 100%;
        min-width: 0;
        max-width: none;
        gap: 5px;
        margin: 0;
      }
    
      .game-filters .filter-group label {
        margin: 0;
        line-height: 1.3;
      }
    
      .game-filters .filter-group select,
      .game-filters .filter-group input[type="search"] {
        min-height: 42px;
        padding-top: 10px;
        padding-bottom: 10px;
      }
    
      .game-filters .platform-filter-group {
        flex: none;
        width: 100%;
        align-items: center;
        margin: 0;
      }
    
      .game-filters .platform-filter {
        justify-content: center;
        gap: 6px;
      }
    
      .game-filters .platform-btn {
        min-height: 38px;
        padding: 8px 10px;
      }
    
      .game-filters .reset-filters {
        align-self: stretch;
        width: 100%;
        min-height: 42px;
        margin: 0;
        box-sizing: border-box;
      }
    }


    /* Reset Filters Button */
    .reset-filters {
      align-self: stretch;
      width: 100%;
      padding: 12px 20px;
      color: #5538bf;
      background: #ffffff;
      border: 1px solid #dfd2ff;
      border-radius: 12px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease,
                  color 0.2s ease,
                  border-color 0.2s ease,
                  transform 0.2s ease;
    }
    
    .reset-filters:hover {
      color: #ffffff;
      background: #7655e8;
      border-color: #7655e8;
      transform: translateY(-2px);
    }
    
    .reset-filters:focus-visible {
      outline: 3px solid rgba(118, 85, 232, 0.3);
      outline-offset: 3px;
    }
    
    @media (max-width: 600px) {
      .reset-filters {
        align-self: stretch;
        width: 100%;
      }
    }
    
    /* Compact toolbar widths */
    .filter-group:has(select) {
      flex: 0 1 135px;
    }
    
    .platform-filter-group {
      flex: 0 0 100%;
      width: 100%;
      max-width: none;
      align-items: center;
    }
    
    .platform-filter {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .game-filters .filter-group:has(input[type="search"]) {
      flex: 1 1 160px;
      max-width: 220px;
    }
    
    .game-filters .platform-filter-group {
      flex: 0 0 auto;
      width: auto;
      max-width: none;
    }
    
    .game-filters .platform-filter {
      flex-wrap: nowrap;
      gap: 6px;
    }
    
    .game-filters .platform-btn {
      gap: 5px;
      padding: 9px 10px;
      font-size: 13px;
    }
    
    .game-filters .platform-count {
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      font-size: 11px;
    }
    
    .game-filters .reset-filters {
      flex: 0 0 auto;
      width: auto;
      white-space: nowrap;
      padding: 12px 14px;
    }
    
    /* Pawcademy Game Search */
    .filter-group input[type="search"] {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 15px;
      color: #29233d;
      background-color: #ffffff;
      border: 1px solid #dfd2ff;
      border-radius: 12px;
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    
    .filter-group input[type="search"]::placeholder {
      color: #a19aae;
    }
    
    .filter-group input[type="search"]:hover {
      border-color: #7655e8;
    }
    
    .filter-group input[type="search"]:focus {
      border-color: #7655e8;
      box-shadow: 0 0 0 3px rgba(118, 85, 232, 0.15);
    }
    
    .empty-state {
      grid-column: 1 / -1;
      width: 100%;
      box-sizing: border-box;
      padding: 48px 24px;
      text-align: center;
      background: linear-gradient(135deg, #fff9ed, #f3edff);
      border: 1px solid #e8ddff;
      border-radius: 24px;
    }
    
    .empty-state-paw {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      margin-bottom: 12px;
      border-radius: 24px;
      background: #e9ddff;
      font-size: 42px;
      transform: rotate(-10deg);
    }
    
    .empty-state h3 {
      margin: 8px 0 12px;
      color: var(--purple);
      font-size: 26px;
      font-weight: 900;
    }
    
    .empty-state p {
      max-width: 440px;
      margin: 0 auto 24px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.7;
    }
    
    .empty-state-button {
      padding: 12px 22px;
      border: none;
      border-radius: 999px;
      background: var(--purple);
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    
    .empty-state-button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    
    @media (max-width: 480px) {
      .empty-state {
        padding: 36px 18px;
      }
    
      .empty-state h3 {
        font-size: 22px;
      }
    }
    
    /* Platform filter buttons */
    .platform-filter-group {
      flex: 0 0 auto;
      width: auto;
      max-width: none;
    }
        
    .platform-filter {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .platform-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid #e2e5ec;
      border-radius: 999px;
      background: #ffffff;
      color: #475569;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease,
        border-color 0.2s ease, box-shadow 0.2s ease;
    }
    
    .platform-btn svg {
      display: block;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    
    .platform-btn:hover {
      border-color: #6d4aff;
      color: #6d4aff;
    }
    
    .platform-btn.active {
      background: #6d4aff;
      border-color: #6d4aff;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(109, 74, 255, 0.2);
    }
    
    .platform-btn:focus-visible {
      outline: 2px solid #6d4aff;
      outline-offset: 3px;
    }
    

  @media (max-width: 600px) {
    .game-filters {
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
      padding: 18px;
    }
  
    .filter-group {
      flex: 1 1 auto;
      min-width: 0;
      max-width: none;
      width: 100%;
    }
  
    .platform-filter-group {
      flex: 0 0 auto;
      width: 100%;
      align-items: center;
    }
  
    .platform-filter {
      justify-content: center;
      flex-wrap: wrap;
    }
  
    .platform-btn {
      min-height: 40px;
      padding: 9px 12px;
    }
  
    .reset-filters {
      align-self: stretch;

  }

    
    /* Platform game count */

    }

      color: #ffffff;
    }

  </style>
</head>

<body>
  <nav>
    
  <a class="logo" href="/" aria-label="Pawcademy Games home">
    <svg
      class="paw-logo"
      xmlns="http://www.w3.org/2000/svg"

  <header class="hero">
    <span class="tag">✨ MADE WITH CONSTRUCT 3</span>
    <h1>Small games.<br>Big adventures.</h1>
    <p>
      A colorful little corner of the internet filled with

  <main class="games" id="games">
    <h2>🎲 My Games</h2>
    <p>Explore the games from my little studio.</p>

    
  <div class="game-filters">
  
    <!-- Baris atas -->
    <div class="filter-row filter-row-top">
      <div class="filter-group">
        <label for="sort-games">Sort Games</label>
        <select id="sort-games">
          <option value="newest">Newest First</option>

      </div>
  
      <div class="filter-group">
        <label for="project-filter">Project Type</label>
        <select id="project-filter">

        </select>
      </div>
  
      <div class="filter-group">
        <label for="genre-filter">Genre</label>

          <button type="button" class="platform-btn"

          </button>
  
          <button type="button" class="platform-btn"

      <div class="filter-group control-filter-group">

        <div class="control-filter" role="group" aria-label="Filter games by control">
          <button type="button" class="control-btn active"
            data-control="all" aria-pressed="true">All</button>
  
          <button type="button" class="control-btn"
            data-control="Keyboard" aria-pressed="false">Keyboard</button>
  
          <button type="button" class="control-btn"
            data-control="Mouse" aria-pressed="false">Mouse</button>
  
          <button type="button" class="control-btn"
            data-control="Touch" aria-pressed="false">Touch</button>
  
          <button type="button" class="control-btn"
            data-control="Gamepad" aria-pressed="false">Gamepad</button>
        </div>
      </div>
  
      <button type="button" id="reset-filters" class="reset-filters">

  </div>

    <div id="game-grid" class="game-grid">
      <p class="message">Loading games...</p>
    </div>
    <p id="status" class="message" aria-live="polite"></p>
  </main>

  <footer>Made with 💜 and Construct 3</footer>

  <script>

    function updatePlatformCounts(games) {
      const counts = {
        all: games.length,
        pc: 0,
        mobile: 0,
        vendingMachine: 0
      };
    
      games.forEach(game => {
        const platforms = Array.isArray(game.platform)
          ? game.platform
          : game.platform
            ? [game.platform]
            : [];
    
        const normalizedPlatforms = platforms.map(platform =>
          String(platform).toLowerCase().trim()
        );
    
        if (normalizedPlatforms.includes("pc")) {
          counts.pc++;
        }
    
        if (normalizedPlatforms.includes("mobile")) {
          counts.mobile++;
        }
    
        if (normalizedPlatforms.includes("vending machine")) {
          counts.vendingMachine++;
        }
      });
    
      document.getElementById("count-all").textContent = counts.all;
      document.getElementById("count-pc").textContent = counts.pc;
      document.getElementById("count-mobile").textContent = counts.mobile;
      document.getElementById("count-vending-machine").textContent =
        counts.vendingMachine;
    }

    
    async function loadGames() {
      const grid = document.getElementById("game-grid");
      const status = document.getElementById("status");
      
      try {
        const response = await fetch("/data/games.json");

        if (!response.ok) {
          throw new Error("Could not load games.json");
        }

        const games = await response.json();
        const publishedGames = games.filter(
          game => game.published === true
        );
        
        updatePlatformCounts(publishedGames);

        projectFilter.replaceChildren(
          new Option("All Project Types", "all")
        );
        
        genreFilter.replaceChildren(
          new Option("All Genres", "all")
        );
        
        const projectTypes = [
          ...new Set(
            publishedGames.map(game => game.projectType).filter(Boolean)
          )
        ];
        
        const genres = [
          ...new Set(
            publishedGames.map(game => game.genre).filter(Boolean)
          )
        ];
        
        projectTypes.forEach(type => {
          const labels = {
            internal: "Internal Project",
            client: "Client Project",
            prototype: "Prototype / Demo"
          };
        
          projectFilter.add(
            new Option(labels[type] || type, type)
          );
        });
        
        genres.forEach(genre => {
          genreFilter.add(new Option(genre, genre));
        });
        
        grid.replaceChildren();

        if (publishedGames.length === 0) {
          const emptyState = document.createElement("div");
          emptyState.className = "empty-state";
        
          const paw = document.createElement("div");
          paw.className = "empty-state-paw";
          paw.setAttribute("aria-hidden", "true");
          paw.textContent = "🐾";
        
          const title = document.createElement("h3");
          title.textContent = "It's a little quiet here!";
        
          const message = document.createElement("p");
          message.textContent =
            "Our next adventure is on its way. Check back soon for more fun games!";
        
          const button = document.createElement("button");
          button.className = "empty-state-button";
          button.textContent = "Explore Pawcademy";
          button.type = "button";
          button.addEventListener("click", () => {
            document.querySelector(".hero")?.scrollIntoView({
              behavior: "smooth"
            });
          });
        
          emptyState.append(paw, title, message, button);
          grid.appendChild(emptyState);
        
          status.textContent = "";
          return;
        }

        publishedGames.forEach(game => {
          const card = document.createElement("article");
          card.className = "game-card";
          card.dataset.projectType = game.projectType || "";
          card.dataset.genre = game.genre || "";
          card.dataset.platform = JSON.stringify(
            Array.isArray(game.platform)
              ? game.platform
              : game.platform
                ? [game.platform]
                : []
          );
          card.dataset.date = game.developmentDate || "";

          const art = document.createElement("div");
          art.className = "game-art";
          art.textContent = "🎮";

          if (game.cover) {
            const img = document.createElement("img");
            img.src = game.cover;
            img.alt = game.title || "Game cover";
            img.loading = "lazy";

            img.onerror = () => {
              img.remove();
              art.textContent = "🎮";
            };

            art.replaceChildren(img);
          }
          
          const badges = document.createElement("div");
          badges.className = "game-card-badges";
          
          const badgeItems = [
            {
              className: "genre",
              icon: "gamepad-2",
              label: game.genre || "Game"
            },
            {
              className: "platform",
              icon: "monitor-smartphone",
              label: Array.isArray(game.platform)
                ? game.platform.join(" · ")
                : game.platform || "Web"
            },
            {
              className: "control",
              icon: "mouse-pointer-2",
              label: game.controls || "Keyboard"
            }
          ];

          badgeItems.forEach(item => {
            const badge = document.createElement("span");
            badge.className = `game-badge ${item.className}`;
          
            const icon = document.createElement("span");
            icon.className = "game-badge-icon";
            icon.setAttribute("aria-hidden", "true");
            
            const iconPaths = {
              "gamepad-2": `
                <path d="M6 12h4m-2-2v4"/>
                <path d="M15 11h.01M18 13h.01"/>
                <path d="M7.5 7h9a5 5 0 0 1 4.8 6.4l-1 3.2a2.5 2.5 0 0 1-4.1 1.1l-2.1-1.8h-4.2l-2.1 1.8a2.5 2.5 0 0 1-4.1-1.1l-1-3.2A5 5 0 0 1 7.5 7Z"/>
              `,
              "monitor-smartphone": `
                <rect x="2" y="3" width="14" height="12" rx="2"/>
                <path d="M8 19h2m-1-4v4"/>
                <rect x="17" y="8" width="5" height="12" rx="1"/>
                <path d="M19 17h1"/>
              `,
              "mouse-pointer-2": `
                <path d="m5 3 14 11-7 1-3 6L5 3Z"/>
                <path d="m12 15 4 5"/>
              `
            };
            
            const svg = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "svg"
            );
            
            svg.setAttribute("viewBox", "0 0 24 24");
            svg.setAttribute("width", "15");
            svg.setAttribute("height", "15");
            svg.setAttribute("fill", "none");
            svg.setAttribute("stroke", "currentColor");
            svg.setAttribute("stroke-width", "1.8");
            svg.setAttribute("stroke-linecap", "round");
            svg.setAttribute("stroke-linejoin", "round");
            
            svg.innerHTML = iconPaths[item.icon];
            icon.append(svg);

          
            const label = document.createElement("span");
            label.textContent = item.label;
          
            badge.append(icon, label);
            badges.append(badge);
          });


          const title = document.createElement("h3");
          title.textContent = game.title || "Untitled Game";

          const description = document.createElement("p");
          description.textContent =
            game.description || "Discover this game.";


          card.append(art, badges, title, description);

          const actions = document.createElement("div");
          actions.className = "game-card-actions";
          // Link to the game details page
          const detailsLink = document.createElement("a");
          detailsLink.className = "button";
          
          detailsLink.href = "/games/details.html?id=" +
          encodeURIComponent(game.id);
          
          detailsLink.textContent = "View Details";
          actions.append(detailsLink);
          
          // Link to play the game directly
          if (game.gameUrl) {
            const link = document.createElement("a");
            link.className = "button";
            link.href = game.gameUrl;
            link.textContent = "Play Game";
            actions.append(link);
          }
          card.append(actions);
          
          grid.append(card);
        });

        /*status.textContent =
          publishedGames.length + " games in the collection.";
          */
   
        filterGames();

      } catch (error) {
        grid.replaceChildren();

        const message = document.createElement("p");
        message.className = "message";
        message.textContent =
          "Games could not be loaded. Please check data/games.json.";

        grid.append(message);
        status.textContent = "";
        console.error(error);
      }
    }
    
function filterGames() {
  const projectType = projectFilter.value;
  const genre = genreFilter.value;
  const sortOrder = sortGames.value;
  const selectedPlatform =
  document.querySelector(".platform-btn.active")?.dataset.platform || "all";
  const selectedControl =
  document.querySelector(".control-btn.active")?.dataset.control || "all";
  const status = document.getElementById("status");
  const searchTerm = gameSearch.value.trim().toLowerCase();

  const grid = document.getElementById("game-grid");
  const cards = [...grid.querySelectorAll(".game-card")];

  // Filter games
  cards.forEach(card => {
    const matchesProject =
      projectType === "all" ||
      card.dataset.projectType === projectType;

    const matchesGenre =
      genre === "all" ||
      card.dataset.genre === genre;
    
    const cardPlatforms = JSON.parse(card.dataset.platform || "[]");

    const matchesPlatform =
      selectedPlatform === "all" ||
      cardPlatforms.some(
        platform => platform.toLowerCase() === selectedPlatform.toLowerCase()
      );
    
    const cardControls = JSON.parse(card.dataset.controls || "[]");

    const matchesControl =
      selectedControl === "all" ||
      cardControls.some(
        control => control.toLowerCase() === selectedControl.toLowerCase()
      );

    const title = card.querySelector("h3").textContent.trim();
    const matchesSearch =
      title.toLowerCase().includes(searchTerm);

    card.hidden = !(
      matchesProject &&
      matchesGenre &&
      matchesSearch &&
      matchesPlatform &&
      matchesControl
    );
  });

  // Sort games
  const sortedCards = [...cards].sort((a, b) => {
    const titleA = a.querySelector("h3").textContent.trim();
    const titleB = b.querySelector("h3").textContent.trim();

    if (sortOrder === "az") {
      return titleA.localeCompare(titleB);
    }

    if (sortOrder === "za") {
      return titleB.localeCompare(titleA);
    }

    const dateA = Date.parse(a.dataset.date || "");
    const dateB = Date.parse(b.dataset.date || "");

    const timeA = Number.isNaN(dateA) ? 0 : dateA;
    const timeB = Number.isNaN(dateB) ? 0 : dateB;

    if (sortOrder === "oldest") {
      return timeA - timeB;
    }

    return timeB - timeA;
  });

  sortedCards.forEach(card => grid.appendChild(card));
  
  const visibleCount = cards.filter(card => !card.hidden).length;
  
  const existingEmptyState = grid.querySelector(".empty-state");
  if (existingEmptyState) {
    existingEmptyState.remove();
  }
  
  if (visibleCount === 0) {
    const emptyState = document.createElement("div");
    emptyState.className = "empty-state";
  
    const paw = document.createElement("div");
    paw.className = "empty-state-paw";
    paw.setAttribute("aria-hidden", "true");
    paw.textContent = "🐾";
  
    const title = document.createElement("h3");
    title.textContent = "No games found!";
  
    const message = document.createElement("p");
    message.textContent =
      "Oops! We couldn't find a game that matches your search or filters. Try another keyword or clear your filters to explore all our games.";
  
    const button = document.createElement("button");
    button.className = "empty-state-button";
    button.type = "button";
    button.textContent = "Clear Search & Filters";
  
    
    button.addEventListener("click", () => {
      projectFilter.value = "all";
      genreFilter.value = "all";
      gameSearch.value = "";
    
      platformButtons.forEach(platformButton => {
        const isActive = platformButton.dataset.platform === "all";
    
        platformButton.classList.toggle("active", isActive);
        platformButton.setAttribute("aria-pressed", String(isActive));
      });
    
      filterGames();
    });

    emptyState.append(paw, title, message, button);
    grid.appendChild(emptyState);
  
    status.textContent = "No matching games.";
    return;
  }
  
  status.textContent =
    visibleCount + " games in the collection.";

  
}

    const sortGames = document.getElementById("sort-games");
    const projectFilter = document.getElementById("project-filter");
    const genreFilter = document.getElementById("genre-filter");
    const resetFilters = document.getElementById("reset-filters");
    const gameSearch = document.getElementById("game-search");

    sortGames.addEventListener("change", filterGames);
    projectFilter.addEventListener("change", filterGames);
    genreFilter.addEventListener("change", filterGames);
    gameSearch.addEventListener("input", filterGames);
    
    const platformButtons = document.querySelectorAll(".platform-btn");
    
    platformButtons.forEach(button => {
      button.addEventListener("click", () => {
        platformButtons.forEach(item => {
          const isActive = item === button;
    
          item.classList.toggle("active", isActive);
          item.setAttribute("aria-pressed", String(isActive));
        });
    
        filterGames();
      });
    });

    resetFilters.addEventListener("click", () => {
      projectFilter.value = "all";
      genreFilter.value = "all";
      gameSearch.value = "";
    
      platformButtons.forEach(button => {
        const isActive = button.dataset.platform === "all";
    
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
    
      filterGames();
    });

    loadGames();

  </script>
</body>
