
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Details | Pawcademy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #202638;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #4057c8;
      text-decoration: none;
      font-weight: bold;
    }

    .game-panel {
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    }

    .cover {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      background: #eef1f8;
      border-radius: 12px;
    }

    .genre {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 12px;
      background: #e8ecff;
      color: #4057c8;
      border-radius: 20px;
      font-size: 13px;
    }

    h1 {
      margin-bottom: 12px;
    }

    .description {
      line-height: 1.7;
      color: #555e70;
      white-space: pre-line;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #4057c8;
      color: white;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .button:hover {
      background: #3045ad;
      transform: translateY(-2px);
    }

    .button.secondary {
      background: #e9ecf5;
      color: #27324a;
    }

    .button.secondary:hover {
      background: #dce1ef;
    }

    .error {
      padding: 24px;
      background: white;
      border-radius: 12px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .game-panel {
        padding: 16px;
      }

      .actions .button {
        text-align: center;
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <a class="back-link" href="/">← Back to Portfolio</a>

    <div id="content">
      <p>Loading game details...</p>
    </div>
  </main>

  <script>
    async function loadGameDetails() {
      const content = document.getElementById("content");
      const params = new URLSearchParams(window.location.search);
      const gameId = params.get("id");

      if (!gameId) {
        content.innerHTML =
          '<div class="error">No game was selected. Please return to the portfolio and choose a game.</div>';
        return;
      }

      try {
        const response = await fetch("/data/games.json");

        if (!response.ok) {
          throw new Error("Could not load games data.");
        }

        const games = await response.json();
        const game = games.find(item => item.id === gameId);

        if (!game || game.published !== true) {
          content.innerHTML =
            '<div class="error">Game not found or not available.</div>';
          return;
        }

        const cover = document.createElement("img");
        cover.className = "cover";
        cover.src = game.cover || "";
        cover.alt = game.title || "Game cover";

        cover.addEventListener("error", () => {
          cover.style.display = "none";
        });

        const panel = document.createElement("section");
        panel.className = "game-panel";

        const genre = document.createElement("span");
        genre.className = "genre";
        genre.textContent = game.genre || "Game";

        const title = document.createElement("h1");
        title.textContent = game.title || "Untitled Game";

        const description = document.createElement("p");
        description.className = "description";
        description.textContent =
          game.description || "Discover and enjoy this game.";

        const actions = document.createElement("div");
        actions.className = "actions";

        const playLink = document.createElement("a");
        playLink.className = "button";
        playLink.href = game.gameUrl || "#";
        playLink.textContent = "Play Game";

        if (!game.gameUrl) {
          playLink.setAttribute("aria-disabled", "true");
          playLink.style.opacity = "0.5";
          playLink.addEventListener("click", event => {
            event.preventDefault();
          });
        }

        const backLink = document.createElement("a");
        backLink.className = "button secondary";
        backLink.href = "/";
        backLink.textContent = "Back to Portfolio";

        actions.append(playLink, backLink);
        panel.append(cover, genre, title, description, actions);
        content.replaceChildren(panel);

        document.title = (game.title || "Game Details") + " | Pawcademy";
      } catch (error) {
        content.innerHTML =
          '<div class="error">Unable to load game details. Please try again later.</div>';
      }
    }

    loadGameDetails();
  </script>
</body>
</html>
