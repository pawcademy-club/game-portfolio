
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>Game Details | Pawcademy</title>

  <style>

        :root {
      --cream: #fff9ed;
      --purple: #7655e8;
      --purple-dark: #5538bf;
      --yellow: #ffd65a;
      --pink: #ff8eb3;
      --ink: #29233d;
      --muted: #716b80;
      --white: #ffffff;
      --lavender: #eee8ff;
      --border: #eee6d8;
      --shadow: 0 18px 45px rgba(76, 53, 114, 0.12);
    }
    
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #4057c8;
      text-decoration: none;
      font-weight: bold;
    }

    .panel {
      padding: 24px;
      margin-bottom: 24px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
    }

    .cover {
      display: block;
      width: 100%;
      height: 440px;
      max-height: 440px;
      object-fit: cover;
      object-position: center;
      background: #eef1f8;
      border-radius: 12px;
    }

    .genre {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 12px;
      background: #e8ecff;
      color: #4057c8;
      border-radius: 20px;
      font-size: 13px;
    }

    h1 {
      margin: 14px 0 12px;
      font-size: clamp(28px, 5vw, 42px);
    }

    h2 {
      margin-top: 0;
      font-size: 23px;
    }

    .description {
      color: #596174;
      line-height: 1.8;
      white-space: pre-line;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #4057c8;
      color: white;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }

    .button:hover {
      background: #3045ad;
      transform: translateY(-2px);
    }

    .button.secondary {
      background: #e9ecf5;
      color: #27324a;
    }

    .button.secondary:hover {
      background: #dce1ef;
    }

    .metadata {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .metadata-item {
      padding: 16px;
      background: #f5f7fb;
      border-radius: 12px;
    }

    .metadata-label {
      display: block;
      margin-bottom: 8px;
      color: #687187;
      font-size: 13px;
    }

    .metadata-value {
      font-weight: bold;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .feature-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      padding: 0;
      list-style: none;
    }

    .feature-list li {
      padding: 14px;
      background: #f5f7fb;
      border-radius: 10px;
      line-height: 1.5;
    }

    .feature-list li::before {
      content: "✓ ";
      color: #4057c8;
      font-weight: bold;
    }

    .screenshot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .screenshot-button {
      display: block;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 12px;
      background: #eef1f8;
      cursor: pointer;
      aspect-ratio: 16 / 10;
    }

    .screenshot-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .25s;
    }

    .screenshot-button:hover img {
      transform: scale(1.05);
    }

    .video-player {
      display: block;
      width: 100%;
      max-height: 600px;
      background: #111;
      border-radius: 12px;
    }

    .empty-message {
      color: #687187;
      line-height: 1.7;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
    }

    .related-card {
      overflow: hidden;
      border: 1px solid #e8ebf2;
      border-radius: 12px;
      background: #fff;
    }

    .related-card img {
      display: block;
      width: 100%;
      height: 145px;
      object-fit: cover;
      background: #eef1f8;
    }

    .related-card-content {
      padding: 14px;
    }

    .related-card h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .related-card p {
      color: #687187;
      font-size: 14px;
      line-height: 1.5;
    }

    .related-card .button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
    }

    .error {
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      line-height: 1.7;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, .92);
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      display: block;
      max-width: min(100%, 1200px);
      max-height: 82vh;
      object-fit: contain;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      color: white;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      box-shadow: none;
      transition: none;
      appearance: none;
    }
    
    .lightbox-close {
      top: 18px;
      right: 18px;
    }
    
    .lightbox-prev {
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
    }
    
    .lightbox-next {
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
    }
    
    .lightbox-close:hover,
    .lightbox-prev:hover,
    .lightbox-next:hover {
      background: transparent;
      color: white;
      box-shadow: none;
      transform: none;
    }
    
    .lightbox-prev:hover,
    .lightbox-next:hover {
      transform: translateY(-50%);
    }
    
    .lightbox-close:focus-visible,
    .lightbox-prev:focus-visible,
    .lightbox-next:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    .lightbox-count {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 14px;
    }

    /*.lightbox button:hover {
      background: rgba(255, 255, 255, .3);
    }*/

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .panel {
        padding: 16px;
      }

      .screenshot-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .lightbox {
        padding: 12px;
      }

      .lightbox-prev {
        left: 8px;
      }

      .lightbox-next {
        right: 8px;
      }

      .cover {
        height: 300px;
        max-height: 300px;
      }
      
    }

        /* Pawcademy visual theme */
    a {
      color: var(--purple);
    }
    
    button,
    .button {
      border-radius: 15px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    button:hover,
    .button:hover {
      transform: translateY(-2px);
    }
    
    h1,
    h2,
    h3 {
      color: var(--ink);
    }
    
    section {
      border-radius: 24px;
    }
    
    article,
    .info-card,
    .related-card {
      border-radius: 22px;
    }
    
    .info-card,
    .related-card {
      background: var(--white);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    
    .gallery-grid img {
      background: var(--cream);
      border: 2px solid var(--white);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(76, 53, 114, 0.08);
      cursor: zoom-in;

      transition: transform 0.25s ease, box-shadow 0.25s ease;
      overflow: hidden;
    }
    
    .gallery-grid img:hover {
      transform: scale(1.035);
      box-shadow: 0 14px 30px rgba(76, 53, 114, 0.18);
    }
    
    video {
      border-radius: 18px;
    }
    
    footer {
      color: var(--muted);
    }

    
    .project-information .metadata {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    
    @media (max-width: 600px) {
      .project-information .metadata {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    
    @media (max-width: 380px) {
      .project-information .metadata {
        grid-template-columns: 1fr;
      }
    }

    /* Project Information - Pawcademy */
    .project-information .metadata-item {
      background: linear-gradient(145deg, #ffffff, #faf7ff);
      border: 1px solid #eee6ff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(76, 53, 114, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
    }

    
    .project-information .project-info-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      margin-bottom: 14px;
      color: #7655e8;
      background: #f0eaff;
      border: 1px solid #e5dcff;
      border-radius: 13px;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 48px;
      margin-top: 20px;
    }
    
    .project-information .project-info-icon svg {
      display: block;
      flex-shrink: 0;
    }


    .project-information .metadata-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(76, 53, 114, 0.10);
    }
    
    .project-information .metadata-label {
      color: #7655e8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-align: center;
    }
    
    .project-information .metadata-value {
      color: #29233d;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.7;
      overflow-wrap: anywhere;
      text-align: center;
    }

    /* Project Status Badge */
    .project-information .project-status-badge {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      border: 1px solid transparent;
      justify-content: center;
    }
    
    .project-information .project-status-badge.completed {
      color: #237a4b;
      background: #e8f8ee;
      border-color: #c6eed5;
    }
    
    .project-information .project-status-badge.in-progress {
      color: #6242c5;
      background: #f0eaff;
      border-color: #dfd2ff;
    }
    
    .project-information .project-status-badge.prototype {
      color: #8a6200;
      background: #fff5cf;
      border-color: #f3e3a0;
    }
    
    /* Project Type Badge */
    .project-information .project-type-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      border: 1px solid transparent;
    }
    
    .project-information .project-type-badge.internal {
      color: #6242c5;
      background: #f0eaff;
      border-color: #dfd2ff;
    }
    
    .project-information .project-type-badge.client {
      color: #245b91;
      background: #e8f3ff;
      border-color: #cce4ff;
    }
    
    .project-information .project-type-badge.prototype {
      color: #8a6200;
      background: #fff5cf;
      border-color: #f3e3a0;
    }

  </style>
</head>

<body>
  <main class="container">
    <a class="back-link" href="/">← Back to Portfolio</a>

    <div id="content">
      <p>Loading game details...</p>
    </div>
  </main>

  <div
    id="lightbox"
    class="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Screenshot viewer"
    aria-hidden="true"
  >
    <button class="lightbox-close" id="lightboxClose"
      type="button" aria-label="Close screenshot viewer">×</button>
    <button class="lightbox-prev" id="lightboxPrev"
      type="button" aria-label="Previous screenshot">‹</button>
    <img id="lightboxImage" src="" alt="Enlarged game screenshot">
    <button class="lightbox-next" id="lightboxNext"
      type="button" aria-label="Next screenshot">›</button>
    <div class="lightbox-count" id="lightboxCount"></div>
  </div>

  <script>
    const content = document.getElementById("content");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCount = document.getElementById("lightboxCount");

    let currentScreenshots = [];
    let currentScreenshotIndex = 0;
    let previousFocus = null;

    function createElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined && text !== null) {
        element.textContent = text;
      }

      return element;
    }

    function createLink(text, href, className = "button") {
      const link = createElement("a", className, text);
      link.href = href;
      return link;
    }

    function openLightbox(index) {
      if (!currentScreenshots.length) return;

      previousFocus = document.activeElement;
      currentScreenshotIndex = index;
      updateLightbox();

      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      document.getElementById("lightboxClose").focus();
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";

      if (previousFocus) {
        previousFocus.focus();
      }
    }

    function updateLightbox() {
      lightboxImage.src = currentScreenshots[currentScreenshotIndex];
      lightboxCount.textContent =
        (currentScreenshotIndex + 1) + " / " + currentScreenshots.length;

      const multiple = currentScreenshots.length > 1;
      document.getElementById("lightboxPrev").hidden = !multiple;
      document.getElementById("lightboxNext").hidden = !multiple;
    }

    function moveLightbox(direction) {
      if (!currentScreenshots.length) return;

      currentScreenshotIndex =
        (currentScreenshotIndex + direction + currentScreenshots.length)
        % currentScreenshots.length;

      updateLightbox();
    }

    document.getElementById("lightboxClose")
      .addEventListener("click", closeLightbox);

    document.getElementById("lightboxPrev")
      .addEventListener("click", () => moveLightbox(-1));

    document.getElementById("lightboxNext")
      .addEventListener("click", () => moveLightbox(1));

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("open")) return;

      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowLeft") moveLightbox(-1);
      if (event.key === "ArrowRight") moveLightbox(1);
    });

    function renderScreenshots(game) {
      const screenshots = Array.isArray(game.screenshots)
        ? game.screenshots.filter(
            item => typeof item === "string" && item.trim() !== ""
          )
        : [];

      const section = createElement("section", "panel project-information");
      section.append(createElement("h2", "", "Screenshots"));

      if (!screenshots.length) {
        section.append(createElement(
          "p",
          "empty-message",
          "Screenshots for this game will be available soon."
        ));
        return section;
      }

      currentScreenshots = screenshots;

      const grid = createElement("div", "screenshot-grid");

      screenshots.forEach((src, index) => {
        const button = createElement("button", "screenshot-button");
        button.type = "button";
        button.setAttribute(
          "aria-label",
          "Open screenshot " + (index + 1)
        );

        const image = document.createElement("img");
        image.src = src;
        image.alt = (game.title || "Game") + " screenshot " + (index + 1);
        image.loading = "lazy";

        image.addEventListener("error", () => {
          button.remove();
        });

        button.append(image);
        button.addEventListener("click", () => openLightbox(index));
        grid.append(button);
      });

      section.append(grid);
      return section;
    }

    function renderVideo(game) {
      const section = createElement("section", "panel");
      section.append(createElement("h2", "", "Gameplay Video"));

      if (
        typeof game.video !== "string" ||
        game.video.trim() === ""
      ) {
        section.append(createElement(
          "p",
          "empty-message",
          "Gameplay video for this game will be available soon."
        ));
        return section;
      }

      const video = document.createElement("video");
      video.className = "video-player";
      video.controls = true;
      video.preload = "metadata";
      video.playsInline = true;

      const source = document.createElement("source");
      source.src = game.video;
      source.type = "video/mp4";

      video.append(source);
      video.append(createElement(
        "p",
        "",
        "Your browser does not support HTML video."
      ));

      section.append(video);
      return section;
    }

    
    function renderMetadata(game) {
      const section = createElement("section", "panel");
      section.append(createElement("h2", "", "Game Information"));
    
      const metadata = createElement("div", "metadata");
    
      const fields = [
        ["Developer", game.developer || "Not specified"],
        ["Controls", game.controls || "Not specified"],
        [
          "Platform",
          Array.isArray(game.platform) && game.platform.length
            ? game.platform.join(", ")
            : "Not specified"
        ],
        ["Orientation", game.orientation || "Not specified"]
      ];
    
      fields.forEach(([label, value]) => {
        const item = createElement("div", "metadata-item");
        item.append(createElement("span", "metadata-label", label));
        item.append(createElement("div", "metadata-value", value));
        metadata.append(item);
      });
    
      section.append(metadata);
      return section;
    }

    
    function renderProjectInformation(game) {
      const section = createElement("section", "panel project-information");
      section.append(
        createElement("h2", "", "Project Information")
      );
    
      const metadata = createElement("div", "metadata");
      const client = game.client || {};
    
      const fields = [
        

        [
          "Development Date",
          game.developmentDate
            ? (() => {
                const dateParts = game.developmentDate.split("-");
                const year = dateParts[0];
                const month = dateParts[1];
        
                if (!month) return year;
        
                const monthNames = [
                  "January", "February", "March", "April",
                  "May", "June", "July", "August",
                  "September", "October", "November", "December"
                ];
        
                const monthIndex = Number(month) - 1;
        
                if (monthIndex < 0 || monthIndex > 11) {
                  return game.developmentDate;
                }
        
                return `${monthNames[monthIndex]} ${year}`;
              })()
            : ""
        ],

        [
          "Project Type",
          {
            internal: "Internal Project",
            client: "Client Project",
            prototype: "Prototype / Demo"
          }[game.projectType] || ""
        ],
        [
          "Client / Organization",
          client.visibility === "public"
            ? (client.name || "")
            : client.visibility === "confidential"
              ? "Confidential Client"
              : ""
        ],
        [
          "Client Country",
          client.country || game.clientCountry || ""
        ],
        [
          "Project Duration",
          game.projectDuration || ""
        ],
        [
          "Role",
          Array.isArray(game.role) ? game.role.join(", ") : ""
        ],
        ["Game Engine", game.engine || ""],
        [
          "Status",
          {
            completed: "Completed",
            "in-progress": "In Progress",
            prototype: "Prototype"
          }[game.status] || ""
        ]
      ];
  
      fields.forEach(([label, value]) => {
        if (!value) return;
      
        const item = createElement("div", "metadata-item");
        const icons = {
          "Development Date": "M8 2v4 M16 2v4 M3 10h18 M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2",
          "Project Type": "M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
          "Client / Organization": "M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M20 8v6 M23 11h-6",
          "Client Country": "M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z",
          "Project Duration": "M12 8v4l3 2 M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20",
          "Role": "m12 3 2.5 5.5L20 11l-5.5 2.5L12 19l-2.5-5.5L4 11l5.5-2.5z M19 14l1.5 3.5L24 19l-3.5 1.5L19 24l-1.5-3.5L14 19l3.5-1.5z",
          "Game Engine": "m12 8 4 4-4 4-4-4z M3 12h5 M16 12h5 M12 3v5 M12 16v5",
          "Status": "m5 12 4 4L19 6"
        };
        
        const svgNS = "http://www.w3.org/2000/svg";
        const iconBox = createElement("div", "project-info-icon");
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("width", "22");
        svg.setAttribute("height", "22");
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", "currentColor");
        svg.setAttribute("stroke-width", "1.8");
        svg.setAttribute("stroke-linecap", "round");
        svg.setAttribute("stroke-linejoin", "round");
        
        const path = document.createElementNS(svgNS, "path");
        path.setAttribute("d", icons[label] || "M12 5v14 M5 12h14");
        svg.append(path);
        iconBox.append(svg);
        item.append(iconBox);
        item.append(createElement("span", "metadata-label", label));
        
        if (label === "Status") {
          const statusBadge = createElement(
            "span",
            "project-status-badge " + (game.status || "prototype"),
            value
          );
          item.append(statusBadge);
        } else if (label === "Project Type") {
          const projectTypeBadge = createElement(
            "span",
            "project-type-badge " + (game.projectType || "internal"),
            value
          );
          item.append(projectTypeBadge);
        } else {
          item.append(createElement("div", "metadata-value", value));
        }

        metadata.append(item);
      });

      if (!metadata.children.length) return null;
    
      section.append(metadata);
      return section;
    }


    function renderFeatures(game) {
      const section = createElement("section", "panel");
      section.append(createElement("h2", "", "Features"));

      const features = Array.isArray(game.features)
        ? game.features.filter(
            item => typeof item === "string" && item.trim() !== ""
          )
        : [];

      if (!features.length) {
        section.append(createElement(
          "p",
          "empty-message",
          "Game features will be available soon."
        ));
        return section;
      }

      const list = createElement("ul", "feature-list");

      features.forEach(feature => {
        list.append(createElement("li", "", feature));
      });

      section.append(list);
      return section;
    }

    function renderRelatedGames(games, currentGame) {
      const section = createElement("section", "panel");
      section.append(createElement("h2", "", "You May Also Like"));

      
      const related = games
        .filter(game =>
          game.published === true &&
          game.id !== currentGame.id
        )
        .sort(() => Math.random() - 0.5)
        .slice(0, 4);


      if (!related.length) {
        section.append(createElement(
          "p",
          "empty-message",
          "More games are coming soon."
        ));
        return section;
      }

      const grid = createElement("div", "related-grid");

      related.forEach(game => {
        const card = createElement("article", "related-card");

        if (game.cover) {
          const image = document.createElement("img");
          image.src = game.cover;
          image.alt = (game.title || "Game") + " cover";
          image.loading = "lazy";

          image.addEventListener("error", () => {
            image.remove();
          });

          card.append(image);
        }

        const cardContent = createElement(
          "div",
          "related-card-content"
        );

        cardContent.append(createElement(
          "h3",
          "",
          game.title || "Untitled Game"
        ));

        cardContent.append(createElement(
          "p",
          "",
          game.description || "Discover this game."
        ));

        cardContent.append(createLink(
          "View Details",
          "/games/details.html?id=" + encodeURIComponent(game.id)
        ));

        grid.append(card);
        card.append(cardContent);
      });

      section.append(grid);
      return section;
    }

    async function loadGameDetails() {
      const params = new URLSearchParams(window.location.search);
      const gameId = params.get("id");

      if (!gameId) {
        content.replaceChildren(createElement(
          "div",
          "error",
          "No game was selected. Please return to the portfolio and choose a game."
        ));
        return;
      }

      try {
        const response = await fetch("/data/games.json");

        if (!response.ok) {
          throw new Error("Could not load games data.");
        }

        const games = await response.json();

        if (!Array.isArray(games)) {
          throw new Error("Games data is not a list.");
        }

        const game = games.find(item =>
          item.id === gameId && item.published === true
        );

        if (!game) {
          content.replaceChildren(createElement(
            "div",
            "error",
            "Game not found or not available."
          ));
          return;
        }

        document.title = (game.title || "Game Details") + " | Pawcademy";
        currentScreenshots = [];

        const fragment = document.createDocumentFragment();
        const hero = createElement("section", "panel");

        if (game.cover) {
          const cover = document.createElement("img");
          cover.className = "cover";
          cover.src = game.cover;
          cover.alt = (game.title || "Game") + " cover";

          cover.addEventListener("error", () => {
            cover.remove();
          });

          hero.append(cover);
        }

        hero.append(createElement(
          "span",
          "genre",
          game.genre || "Game"
        ));

        hero.append(createElement(
          "h1",
          "",
          game.title || "Untitled Game"
        ));

        hero.append(createElement(
          "p",
          "description",
          game.description || "Discover and enjoy this game."
        ));

        const actions = createElement("div", "actions");

        if (game.gameUrl) {
          actions.append(createLink("Play Game", game.gameUrl));
        }

        actions.append(createLink(
          "Back to Portfolio",
          "/",
          "button secondary"
        ));

        hero.append(actions);
        fragment.append(hero);
        fragment.append(renderMetadata(game));
        const projectInformation = renderProjectInformation(game);
        if (projectInformation) {
          fragment.append(projectInformation);
        }
        fragment.append(renderFeatures(game));
        fragment.append(renderScreenshots(game));
        fragment.append(renderVideo(game));
        fragment.append(renderRelatedGames(games, game));

        content.replaceChildren(fragment);
      } catch (error) {
        content.replaceChildren(createElement(
          "div",
          "error",
          "Unable to load game details. Please check the game data and try again."
        ));
      }
    }

    loadGameDetails();
  </script>
</body>
</html>
